<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOF Studio — Administration</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24211e;background:#f4f1eb}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center}h1{font:normal 44px Georgia,serif;margin:20px 0 5px}h2{font:normal 27px Georgia,serif}section{background:#fff;border:1px solid #e0dcd4;padding:24px;margin:22px 0}label{display:block;margin:13px 0 5px}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:12px;border:1px solid #c9c3b8;background:white;font:inherit}button{padding:12px 16px;background:#24211e;color:white;border:0;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.5}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #ddd;padding:14px 0}.row img{width:86px;height:86px;object-fit:contain;background:#f5f5f5}.row>div:first-child{display:flex;align-items:center;gap:12px}.row button{white-space:nowrap}.error{color:#a31e20}.hint{color:#665f56;font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{color:inherit}@media(max-width:600px){.cols{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}h1{font-size:36px}section{padding:16px}}
</style></head><body><main><header><strong>NOF / STUDIO</strong><a href="/">Voir le portfolio ↗</a></header><h1>Administration</h1><p class="hint">Collection privée — connexion sécurisée</p><p id="notice" role="status"></p>
<section id="login"><h2>Connexion</h2><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button>Se connecter</button></form></section>
<div id="workspace" class="hidden"><button id="logout">Se déconnecter</button><section><h2 id="heading">Nouvelle œuvre</h2><form id="artForm"><input id="artId" type="hidden"><label for="title">Titre *</label><input id="title" maxlength="180" required><label for="description">Description</label><textarea id="description" rows="4"></textarea><label for="technique">Technique</label><input id="technique" value="Acrylique sur toile"><div class="cols"><div><label for="width">Largeur (cm)</label><input id="width" type="number" min="0" step=".1"></div><div><label for="height">Hauteur (cm)</label><input id="height" type="number" min="0" step=".1"></div><div><label for="year">Année</label><input id="year" type="number" min="1900" max="2100"></div><div><label for="price">Prix (€)</label><input id="price" type="number" min="0" step=".01"></div></div><label for="status">Disponibilité</label><select id="status"><option value="available">Disponible</option><option value="reserved">Réservé</option><option value="sold">Vendu</option></select><label for="photo">Photo (JPG, PNG, WebP ; 8 Mo max)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div id="photoTools" class="hidden"><label><input type="checkbox" id="cleanWhite"> Nettoyer le fond clair pour le rendre blanc</label><label for="tolerance">Intensité du nettoyage : <span id="tolValue">45</span></label><input id="tolerance" type="range" min="15" max="95" value="45" step="5"><div><img id="photoPreview" alt="Aperçu avant importation" style="max-width:100%;max-height:340px;object-fit:contain;background:#fff;border:1px solid #ddd"></div></div><p class="hint">Le nettoyage local convient aux fonds déjà clairs. Il ne détoure pas un décor complexe. Vérifie la photo avant publication.</p><label><input id="published" type="checkbox"> Publier sur le portfolio</label><div><button id="save">Enregistrer</button><button id="clear" type="button">Nouvelle œuvre</button></div></form></section><section><h2>Mes œuvres</h2><div id="list"></div></section></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
import {prepareWhiteBackground} from './photo-prep.js';
const sb=createClient('https://gajbqvsxsmmchnfvweay.supabase.co','sb_publishable_PaYWt1IJjs3zgdhe28lomg_CCKlHER8');
const $=id=>document.getElementById(id),notify=(s,error=false)=>{$('notice').textContent=s;$('notice').className=error?'error':''};let artworks=[],isAdmin=false,preparedFile=null,previewUrl=null,prepRun=0;
const updatePreview=async()=>{const file=$('photo').files[0],run=++prepRun;preparedFile=null;if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}$('photoTools').classList.toggle('hidden',!file);if(!file)return;try{notify('Préparation de la photo…');const cleaned=$('cleanWhite').checked?await prepareWhiteBackground(file,Number($('tolerance').value)):file;if(run!==prepRun)return;preparedFile=cleaned;previewUrl=URL.createObjectURL(cleaned);$('photoPreview').src=previewUrl;notify('Aperçu prêt')}catch(err){notify('Préparation impossible : '+err.message,true)}};
$('photo').addEventListener('change',updatePreview);$('cleanWhite').addEventListener('change',updatePreview);$('tolerance').addEventListener('input',()=>{$('tolValue').textContent=$('tolerance').value});$('tolerance').addEventListener('change',updatePreview);
async function checkAuth(){const {data:{user},error}=await sb.auth.getUser();if(error)console.warn(error);isAdmin=false;if(user){const r=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!r.data&&!r.error} $('login').classList.toggle('hidden',isAdmin);$('workspace').classList.toggle('hidden',!isAdmin);if(user&&!isAdmin)notify('Ce compte ne dispose pas des droits administrateur.',true);if(isAdmin)await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();notify('Connexion…');const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return notify(error.message,true);$('password').value='';await checkAuth()};
$('logout').onclick=async()=>{await sb.auth.signOut();artworks=[];notify('Déconnecté');await checkAuth()};
function clear(){ $('artForm').reset();$('artId').value='';$('heading').textContent='Nouvelle œuvre';preparedFile=null;++prepRun;$('photoTools').classList.add('hidden');if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null}$('clear').onclick=clear;
const number=id=>$(id).value===''?null:Number($(id).value);
$('artForm').onsubmit=async e=>{e.preventDefault();if(!isAdmin)return;const btn=$('save');btn.disabled=true;notify('Enregistrement…');let uploaded=null;try{const previous=artworks.find(a=>a.id===$('artId').value);let image_path=previous?.image_path||null;const file=$('photo').files[0]?preparedFile:null;if($('photo').files[0]&&!file)throw Error('Attends la préparation de la photo');if(file){if(file.size>8*1024*1024)throw Error('La photo dépasse 8 Mo');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Format photo non autorisé');uploaded=crypto.randomUUID()+'.'+(file.type==='image/jpeg'?'jpg':file.type.split('/')[1]);const up=await sb.storage.from('artworks-images').upload(uploaded,file,{contentType:file.type});if(up.error)throw up.error;image_path=uploaded}const data={title:$('title').value.trim(),description:$('description').value.trim(),technique:$('technique').value.trim(),width_cm:number('width'),height_cm:number('height'),year_created:number('year'),price_eur:number('price'),status:$('status').value,published:$('published').checked,image_path,updated_at:new Date().toISOString()};if(!data.title)throw Error('Le titre est obligatoire');const res=previous?await sb.from('artworks').update(data).eq('id',previous.id):await sb.from('artworks').insert(data);if(res.error)throw res.error;clear();notify('Œuvre enregistrée');await load()}catch(err){if(uploaded)await sb.storage.from('artworks-images').remove([uploaded]);notify(err.message||String(err),true)}finally{btn.disabled=false}};
async function load(){const r=await sb.from('artworks').select('*').order('created_at',{ascending:false});if(r.error)return notify(r.error.message,true);artworks=r.data||[];const list=$('list');list.replaceChildren();if(!artworks.length){list.textContent='Aucune œuvre pour le moment.';return}for(const art of artworks){const row=document.createElement('div');row.className='row';const info=document.createElement('div');if(art.image_path){const imgResult=await sb.storage.from('artworks-images').createSignedUrl(art.image_path,300);if(imgResult.data?.signedUrl){const img=document.createElement('img');img.src=imgResult.data.signedUrl;img.alt='';info.append(img)}}const caption=document.createElement('div');const strong=document.createElement('strong');strong.textContent=art.title;const small=document.createElement('div');small.className='hint';small.textContent=art.published?'Publiée':'Brouillon';caption.append(strong,small);info.append(caption);const controls=document.createElement('div');const edit=document.createElement('button');edit.textContent='Modifier';edit.onclick=()=>{for(const [field,key] of Object.entries({title:'title',description:'description',technique:'technique',width:'width_cm',height:'height_cm',year:'year_created',price:'price_eur',status:'status'}))$(field).value=art[key]??'';$('published').checked=art.published;$('artId').value=art.id;$('heading').textContent='Modifier une œuvre';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.textContent='Supprimer';del.onclick=async()=>{if(!confirm('Supprimer « '+art.title+' » ?'))return;const result=await sb.from('artworks').delete().eq('id',art.id);if(result.error)return notify(result.error.message,true);notify('Œuvre supprimée');await load()};controls.append(edit,del);row.append(info,controls);list.append(row)}}
await checkAuth();sb.auth.onAuthStateChange(()=>setTimeout(checkAuth,0));
</script></body></html>
